name: shareeat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/iconfood.png"
  min_sdk_android: 21
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.8
  firebase_database: ^12.1.0
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  intl: ^0.20.2
  google_maps_flutter: ^2.14.0
  flutter_launcher_icons: ^0.14.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/food.jpg
